name: Release

# Builds the frontend once, then the server for every supported target, and attaches the
# binaries — plus a checksum file — to a GitHub Release.
#
# Targets:
#   x86_64-unknown-linux-musl    Linux x64,     static (most Linux hosts)
#   aarch64-unknown-linux-musl   Linux ARM64,   static (ARM cloud instances)
#   x86_64-pc-windows-msvc       Windows x64    (on-prem alongside NSClient itself)
#   aarch64-pc-windows-msvc      Windows ARM64
#
# What each trigger produces:
#
#   push to main   →  the next release, as a DRAFT: tag `v<version>`, title `<version>`.
#                     Every commit (in practice every merge) rebuilds it and replaces the
#                     previous draft, so there is exactly one draft, built from the tip of
#                     main. Releasing is publishing that draft in the GitHub UI.
#   push of v*     →  a published release at that tag — the command-line way to release.
#                     Publishing a draft also creates its tag, and that push lands here
#                     too; it finds the release already published and builds nothing.
#   manual run     →  builds the whole matrix and stops. A rehearsal; publishes nothing.
#
# Tags keep the `v` prefix; release *titles* are the bare version — `1.2.3` — and are
# byte-identical to what `nsclient-fleet --version` prints for that build.
#
# A draft release does not create its git tag — GitHub only does that when someone
# publishes it. Drafts therefore never pollute the tag namespace, and they are visible
# to collaborators only, not to the public.
#
# Versions come from git tags, not from Cargo.toml: `codacy/git-version` reads the last
# tag and bumps it (patch by default; `feature:` or `breaking:` in a commit message bumps
# minor or major). The computed version is resolved once, up front, and then used for BOTH
# the release name and the version compiled into the binary — so `nsclient-fleet --version`
# always matches the release it came from. `Cargo.toml`'s version is only the fallback for
# local builds.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Every merge to main replaces the one draft, so two runs for main must not overlap: the
# older commit could finish last and leave its build as the draft. A newer push supersedes
# an older one outright. Tag runs and manual rehearsals are grouped apart and never cancelled.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolved before anything is built, because the version is compiled into the binary as
  # well as used to name the release.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compute.outputs.build }}
      tag: ${{ steps.compute.outputs.tag }}
      name: ${{ steps.compute.outputs.name }}
      draft: ${{ steps.compute.outputs.draft }}
      skip: ${{ steps.published.outputs.skip }}
    steps:
      # Publishing a draft creates its tag, and that tag push starts this workflow again.
      # The release it would build is the one just published — same commit, assets already
      # attached — so rebuilding would only re-upload binaries under a live release while
      # publish-docker is downloading them. A tag pushed from the command line has no
      # release yet and is built as usual. Drafts are invisible to this lookup, so a 404 is
      # "not published"; any other failure stops the run rather than guessing.
      - name: Check for an already-published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .html_url 2>"$RUNNER_TEMP/err.txt"); then
            echo "::notice::${TAG} is already published (${url}); nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/err.txt"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/err.txt" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-version walks back to the last tag; a shallow clone has no tags to find.
          fetch-depth: 0

      # Skipped on tag pushes: there the tag *is* the answer, and asking a tool to derive
      # a version while sitting on a detached tag ref only invites disagreement.
      - name: Derive version from tags
        id: gitversion
        if: github.ref_type != 'tag'
        uses: codacy/git-version@376c75fc90be05da2e5c3b7e54de18524b5226bd # 2.8.8
        with:
          release-branch: main
          prefix: v

      # Values arrive as env vars rather than being interpolated into the script, so
      # nothing from the ref name can be executed as shell.
      - name: Assemble release identity
        id: compute
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GV_TAG: ${{ steps.gitversion.outputs.version }}
          GV_PLAIN: ${{ steps.gitversion.outputs.non-prefixed-version }}
        run: |
          set -euo pipefail
          # The release is titled with the bare version — no `v`, no suffix — so it reads
          # identically to what `nsclient-fleet --version` prints.
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            version="${tag#v}"
            draft=false
          else
            if [ -z "$GV_TAG" ] || [ -z "$GV_PLAIN" ]; then
              echo "git-version produced no version — is fetch-depth 0 set?" >&2
              exit 1
            fi
            # The version the draft becomes once published, so its binaries already report
            # what they will be released as. Merges until then compute the same one unless
            # a commit message asks for a minor or major bump; publishing creates the tag,
            # and the next merge bumps from there.
            tag="$GV_TAG"
            version="$GV_PLAIN"
            draft=true
          fi
          {
            echo "tag=$tag"
            echo "name=$version"
            echo "build=$version"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Built once and shared, so every platform's binary embeds byte-identical frontend
  # assets. rust-embed bakes web/dist into the binary at compile time, so this artifact
  # has to be in place before any cargo build starts.
  #
  # Waits on `version` only to learn whether there is anything to build; `build` and
  # `release` need this job, so skipping it here skips them too.
  web:
    name: Frontend
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.name }}
    needs: [version, web]
    runs-on: ${{ matrix.runner }}
    env:
      # Compiled into the binary; `--version` reports it. See `handled_immediate_flag` in
      # crates/server/src/main.rs and the build script that invalidates on change.
      FLEET_BUILD_VERSION: ${{ needs.version.outputs.build }}
    defaults:
      run:
        # bash on every runner, Windows included, so the shared steps below are identical
        # across the matrix instead of forking into pwsh.
        shell: bash
    strategy:
      # One broken target should not hide the results for the other three.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            ext: ""
          - name: linux-aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            ext: ""
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            ext: ".exe"
          - name: windows-aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
            cross: false
            ext: ".exe"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # aws-lc-sys assembles AWS-LC's x86_64 routines with NASM, which is not on the
      # Windows images. Harmless on the ARM64 target, which uses different sources.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      # Fail here, with an actionable message, rather than several minutes later inside
      # aws-lc-sys's CMake invocation with an error that does not name the real cause.
      - name: Verify ARM64 MSVC toolchain is present
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $found = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if (-not $found) {
            throw "This runner image has no ARM64 MSVC build tools (VC.Tools.ARM64), so " +
                  "aarch64-pc-windows-msvc cannot be cross-compiled here. Either pin an " +
                  "image that ships them, or move this matrix entry to a native " +
                  "'windows-11-arm' runner and drop the cross-compile."
          }
          Write-Host "ARM64 build tools: $found"

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      # Cargo.lock is committed, so --locked keeps a release reproducible: a dependency
      # publishing a new semver-compatible version cannot silently change what we ship.
      - name: Build nsclient-fleet
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} --bin nsclient-fleet
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin nsclient-fleet
          fi

      # Symbols are already stripped by [profile.release] in Cargo.toml.
      - name: Stage artifact
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/nsclient-fleet${{ matrix.ext }}"
          dest="dist/nsclient-fleet-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$dest"
          ls -lh "$dest"

      # Native targets only — an x64 runner cannot execute an ARM64 binary. Proves the
      # binary links and runs; --version is answered before config is read, so this works
      # without MASTER_KEY. Not a substitute for the test suite.
      - name: Smoke-test the binary
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          set -euo pipefail
          got=$(./dist/nsclient-fleet-${{ matrix.target }}${{ matrix.ext }} --version)
          echo "reported: $got"
          # Also proves the version injection reached the compiler — including through
          # cross's container, which only forwards variables listed in Cross.toml.
          expected="nsclient-fleet ${{ needs.version.outputs.build }}"
          if [ "$got" != "$expected" ]; then
            echo "version mismatch: expected '$expected'" >&2
            exit 1
          fi

          # --hash-password is what an on-prem install runs before it can log in at all,
          # and it is the one code path that reads a terminal. Piping a password exercises
          # the non-interactive branch; that it produces a PHC string proves argon2 linked
          # and ran in the shipped binary rather than only in the test build.
          hash=$(echo 'a test password' | ./dist/nsclient-fleet-${{ matrix.target }}${{ matrix.ext }} --hash-password 2>/dev/null)
          case "$hash" in
            '$argon2id$'*) echo "hash-password: ok" ;;
            *) echo "hash-password produced no PHC string: '$hash'" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nsclient-fleet-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    # workflow_dispatch runs the matrix as a rehearsal and stops here.
    if: github.event_name == 'push'
    permissions:
      contents: write
      # Keyless signing of the build provenance: GitHub mints a short-lived OIDC token for
      # this job, Sigstore issues a certificate for it, and the attestation records which
      # workflow at which commit produced each file. `gh attestation verify` then answers
      # "did this binary come out of this repository's release workflow" — which a checksum
      # file served from the same origin as the binary cannot.
      id-token: write
      attestations: write
    steps:
      # Only so bootstrap-vm.sh and the unit file can be attached as assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: nsclient-fleet-*
          merge-multiple: true

      # The script and the unit are release assets that get executed and installed as root,
      # so they belong in the checksum file and in the attestation exactly as much as the
      # binaries do. They used to be attached without either.
      - name: Stage the installer assets
        run: cp scripts/bootstrap-vm.sh scripts/nsclient-fleet.service dist/

      - name: Checksums
        working-directory: dist
        run: |
          # Explicit names rather than '*' so the checksum file can never list itself.
          sha256sum nsclient-fleet-* bootstrap-vm.sh nsclient-fleet.service > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/nsclient-fleet-*
            dist/bootstrap-vm.sh
            dist/nsclient-fleet.service

      # One draft at a time: the next release, built from the tip of main. GitHub's lookup by
      # tag does not see drafts, so the action below cannot reuse the previous one and would
      # add a second draft beside it on every merge; delete it first instead. Only drafts
      # this workflow created are touched — one written by hand is left alone. Release notes
      # typed into the auto-generated draft go with it, so write them just before publishing.
      - name: Replace the previous draft
        if: needs.version.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Published while this run was building: the tag now belongs to a live release,
          # and uploading here would swap its binaries for this commit's. A re-run computes
          # the next version from the new tag.
          if url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .html_url 2>"$RUNNER_TEMP/err.txt"); then
            echo "::error::${TAG} was published while this ran (${url}). Re-run the workflow to draft the next version." >&2
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/err.txt"; then
            cat "$RUNNER_TEMP/err.txt" >&2
            exit 1
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft and .author.login == "github-actions[bot]") | "\(.id) \(.tag_name)"' |
          while read -r id old_tag; do
            echo "Deleting previous draft ${old_tag} (${id})"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.name }}
          draft: ${{ needs.version.outputs.draft }}
          # Pins the draft to the exact commit it was built from: when it is published,
          # GitHub creates its tag here rather than at whatever main has drifted to.
          target_commitish: ${{ github.sha }}
          # dist now holds the binaries, SHA256SUMS, and the two installer assets — see the
          # staging step above for why those are in there rather than attached from the
          # checkout directly.
          files: dist/*
          generate_release_notes: true
