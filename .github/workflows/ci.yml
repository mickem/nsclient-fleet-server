name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So an advisory published after the last commit is still found.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    # Both host platforms we ship binaries for. Linux is the SaaS target; Windows is where
    # on-prem installs live, and it is a genuinely different build (MSVC toolchain, no
    # unix-only code paths) — catching that at PR time beats catching it at tag time.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # aws-lc-sys assembles AWS-LC's x86_64 routines with NASM, which is not on the
      # Windows runner images.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      # rust-embed bakes web/dist into the binary at compile time, so this has to happen
      # before any cargo invocation that builds the server crate.
      - name: Build web
        working-directory: web
        run: npm run build

      # Lints are platform-independent; running them once keeps the Windows job to the
      # part that actually differs.
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Advisories were only ever checked by hand, which means they were checked once. This
  # runs on every PR and on a schedule, so a advisory published after a dependency was last
  # touched is still found.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # The web bundle ships inside the binary, so its dependencies are the server's.
      # `--omit=dev` because a build-time advisory in vite is not something a deployed
      # binary is exposed to, and mixing the two makes the signal unreadable.
      - name: npm audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
