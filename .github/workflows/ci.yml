name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    # Both host platforms we ship binaries for. Linux is the SaaS target; Windows is where
    # on-prem installs live, and it is a genuinely different build (MSVC toolchain, no
    # unix-only code paths) — catching that at PR time beats catching it at tag time.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # aws-lc-sys assembles AWS-LC's x86_64 routines with NASM, which is not on the
      # Windows runner images.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      # rust-embed bakes web/dist into the binary at compile time, so this has to happen
      # before any cargo invocation that builds the server crate.
      - name: Build web
        working-directory: web
        run: npm run build

      # Lints are platform-independent; running them once keeps the Windows job to the
      # part that actually differs.
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
