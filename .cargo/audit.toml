# Advisories cargo-audit reports that we have consciously decided not to act on.
#
# The bar for an entry here is high, and "we looked and it is not exploitable" is not on its
# own enough — an unexploitable advisory that has a fixed version gets the fixed version,
# because the next reader should not have to redo the analysis. An entry belongs here only
# when there is nothing to upgrade to.
#
# Re-check this list whenever it is touched: an advisory that gains a fix should leave.

[advisories]
ignore = [
    # libsqlite3-sys 0.30.1 bundles SQLite < 3.54.0 (CVE-2026-119375): a database opened
    # together with a crafted `-wal` file can return uninitialised page-cache memory.
    #
    # Nothing to upgrade to: the fix is libsqlite3-sys >= 0.39.0, and sqlx-sqlite 0.9.0 — the
    # newest sqlx — only accepts < 0.38.0. Remove this entry as soon as an sqlx release does.
    #
    # Not exploitable here: the advisory exposes only "a process that opens a database file,
    # with its `-wal`, that a less trusted party could have written". The server opens only
    # its own database in its own data directory.
    "RUSTSEC-2026-0459",
]
